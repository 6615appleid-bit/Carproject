; ---------------------------------------------------------------------------
; PlatformIO target for the STM32F103C8T6 line-following / obstacle-avoiding car.
;
; The Keil MDK project (MDK/CarProject.uvprojx) stays the reference build. This
; target compiles the same sources with the GNU toolchain and lets the board be
; flashed over ST-Link:
;
;   pio run                 build
;   pio run -t upload       flash over ST-Link
;   pio run -t clean        remove .pio/build
;
; No PlatformIO framework is used on purpose. The firmware is written against
; the STM32 Standard Peripheral Library and the CMSIS copy committed under
; Libraries/, which is exactly what the Keil build uses. Only the three files
; the vendor library does not provide in GNU form are added locally:
;   platformio/startup_stm32f103xb_gcc.S   vector table + Reset_Handler
;   platformio/stm32f103c8tx.ld            64 KB flash / 20 KB RAM
;   Platform/Platform_stm32.c              SysTick time base
; Mixing in the CMSIS/HAL headers of a framework would put two different
; CMSIS core headers (V1.30 from Libraries/CMSIS and the CMSIS 5 copy of the
; framework) into one build, which does not compile.
; ---------------------------------------------------------------------------

[platformio]
; Sources live in App/, Hardware/, Platform/, ... at the project root, not in
; src/. The build_src_filter below therefore decides what is compiled.
src_dir = .
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8

; --- ST-Link (SWD) 烧录 / 调试 -------------------------------------------------
;
; 本机 TCP 3333 被 Windows 系统进程 WUDFCompanionHost.exe 长期占用（状态是
; Bound 而不是 LISTENING，所以 netstat 看不到它）。OpenOCD 默认用 3333 起
; gdb server，于是还没碰到芯片就直接失败：
;     Error: couldn't bind gdb to socket on port 3333
;     ** OpenOCD init failed **
;
; ststm32 的 openocd 上传分支用 env.Replace() 覆盖 UPLOADERFLAGS，所以
; upload_flags 在这条路径上会被丢掉（与 stm32test 里记录的现象一致），
; 因此这里改用 upload_protocol = custom + upload_command，把 gdb 端口
; 挪到 13333，并显式给出 OpenOCD 的 config 脚本目录。
;
; 上传命令与 Keil 那套一致：SWD、program + verify + reset、结束后退出。
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-openocd/bin/openocd" -s "${platformio.packages_dir}/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select swd" -f target/stm32f1x.cfg -c "gdb port 13333" -c "program {$BUILD_DIR/firmware.elf} verify reset exit"

; 调试器也用 ST-Link。这个板子的默认调试工具是 blackmagic，不指定的话调试会报错。
; 适配器速度(kHz)默认 1000，接线较长或山砦 ST-Link 不稳时可降到 500 或 100：
;   debug_speed = 1000
debug_tool = stlink

; Whitelist of the real firmware sources.
; Excluded on purpose:
;   Startup/  Keil ARMASM syntax, cannot be assembled by GCC
;   Test/     host tests plus mock modules that duplicate the real interfaces
;   Build/    Keil objects plus older copies of Avoid.c / track.c / Ultrasound.c
;   MDK/      Keil project files
;   Libraries/CMSIS/core_cm3.c  CMSIS V1.30 core file, rejected by recent GNU
;             assemblers; under GCC the core functions are already inline in
;             Libraries/CMSIS/core_cm3.h
build_src_filter =
    +<App/>
    +<Drivers/>
    +<Hardware/>
    +<Modules/>
    +<Platform/>
    +<User/>
    +<Libraries/CMSIS/system_stm32f10x.c>
    +<Libraries/STM32F10x_StdPeriph_Driver/src/>
    +<platformio/>

build_flags =
    -D STM32F10X_MD
    -D USE_STDPERIPH_DRIVER
    -I App
    -I Drivers
    -I Hardware
    -I Modules
    -I Platform
    -I User
    -I Libraries/CMSIS
    -I Libraries/STM32F10x_StdPeriph_Driver/inc
    ; newlib-nano plus stubbed syscalls, as in a CubeIDE project.
    --specs=nano.specs
    --specs=nosys.specs

; 64 KB flash / 20 KB RAM, the same map as the Keil scatter file
; (LR_IROM1 0x08000000 0x10000, RW_IRAM1 0x20000000 0x5000).
board_build.ldscript = platformio/stm32f103c8tx.ld

